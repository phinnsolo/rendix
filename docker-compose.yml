services:
  db:
    image: postgres:16-alpine
    container_name: examenes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: examenes
      POSTGRES_PASSWORD: examenes
      POSTGRES_DB: examenes
    ports:
      - "5432:5432"
    volumes:
      - examenes-pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examenes -d examenes"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  examenes-pgdata:
